name: Build ZAB Mobil Neu V100
on:
  push:
    branches: [ "zab-mobile-neu-v100" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zab-mobile-neu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Decode signing key
        run: base64 -d app/zab-release.jks.b64 > app/zab-release.jks
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ZAB_Mobil_NEU_V100
          path: zab-mobile-neu/app/build/outputs/apk/release/app-release.apk
