name: Build ZAB Mobil Neu V101
on:
  push:
    branches: [ "zab-mobile-neu-v100" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zab-mobile-neu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore V100 release signing key
        uses: actions/download-artifact@v4
        with:
          name: ZAB_Mobil_NEU_V100_SIGNING_KEY
          path: zab-mobile-neu/app
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31259954086
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ZAB_Mobil_NEU_V101
          path: zab-mobile-neu/app/build/outputs/apk/release/app-release.apk
