name: Build ZAB Mobil Neu V100
on:
  push:
    branches: [ "zab-mobile-neu-v100" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zab-mobile-neu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate release signing key
        run: |
          keytool -genkeypair -v -keystore app/zab-release.jks -alias zabmobile -keyalg RSA -keysize 3072 -validity 10000 -storepass ZABmobil2026 -keypass ZABmobil2026 -dname "CN=Zuhause am Bach, OU=Mobil, O=ZAB, L=Aggsbach Markt, ST=Niederoesterreich, C=AT"
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ZAB_Mobil_NEU_V100
          path: zab-mobile-neu/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZAB_Mobil_NEU_V100_SIGNING_KEY
          path: zab-mobile-neu/app/zab-release.jks
