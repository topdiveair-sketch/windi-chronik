name: Build Einkauf App APK

on:
  push:
    branches: [main, einkauf-app-apk, apk-build-trigger]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: einkauf-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Einkauf-Zuhause-am-Bach-APK
          path: einkauf-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
