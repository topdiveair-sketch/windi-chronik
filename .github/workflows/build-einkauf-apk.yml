name: Build Einkauf APK

on:
  push:
    branches: [einkauf-app-apk]
    paths:
      - 'android-einkauf/**'
      - '.github/workflows/build-einkauf-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-einkauf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK installieren
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Debug APK bauen
        run: gradle assembleDebug --stacktrace
      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Einkauf-Zuhause-am-Bach-APK
          path: android-einkauf/app/build/outputs/apk/debug/app-debug.apk
