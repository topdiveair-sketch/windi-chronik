<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#214d3a"><title>Einkauf Zuhause am Bach</title><style>
:root{--green:#214d3a;--green2:#2f6b50;--cream:#f5f1e8;--text:#17231d;--muted:#67746d;--line:#dbe3de;--danger:#a43b3b}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text)}header{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:22px 18px 18px;position:sticky;top:0;z-index:10;box-shadow:0 3px 12px #0003}header h1{font-size:24px;margin:0 0 4px}.sub{font-size:13px;opacity:.9}.status{margin-top:10px;font-size:12px;padding:8px 10px;border-radius:10px;background:#ffffff18}main{max-width:760px;margin:auto;padding:14px 14px 110px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.btn{border:0;border-radius:13px;padding:13px 12px;font-weight:750;font-size:14px;background:var(--green);color:#fff;box-shadow:0 2px 6px #0002}.btn.secondary{background:#fff;color:var(--green);border:1px solid var(--line)}.btn.gold{background:#b7791f}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.metric{background:#fff;border-radius:14px;padding:12px;text-align:center;border:1px solid var(--line)}.metric strong{display:block;font-size:20px}.metric span{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 10px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:650}.tab.active{background:var(--green);color:#fff}.shop{margin:12px 0 18px}.shop h2{margin:0 0 8px;font-size:18px;display:flex;justify-content:space-between}.shop h2 small{font-size:12px;color:var(--muted)}.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;margin:8px 0;box-shadow:0 2px 8px #0000000b}.row{display:flex;gap:10px;align-items:flex-start}.check{width:24px;height:24px;margin-top:2px;accent-color:var(--green)}.grow{flex:1}.title{font-weight:800;font-size:16px}.brand{font-size:13px;color:var(--muted);margin-top:2px}.price{font-size:19px;font-weight:850;color:var(--green);white-space:nowrap}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.chip{font-size:11px;background:#eef4f0;padding:5px 7px;border-radius:999px;color:#385345}.chip.action{background:#fff0bd;color:#6d4c00}.chip.bad{background:#fbe4e4;color:#7f2525}.details{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.45}.actions{display:flex;gap:8px;margin-top:11px}.mini{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-weight:700;color:var(--green)}.mini.delete{color:var(--danger)}.done{opacity:.5}.done .title{text-decoration:line-through}.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}.fab{position:fixed;right:18px;bottom:20px;width:58px;height:58px;border-radius:50%;font-size:30px;border:0;background:var(--green);color:#fff;box-shadow:0 5px 18px #0005}dialog{border:0;border-radius:18px;width:min(92vw,520px);padding:0;box-shadow:0 15px 50px #0005}dialog form{padding:18px}dialog h3{margin-top:0}label{display:block;font-size:12px;font-weight:700;margin-top:10px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin-top:4px}.form-actions{display:flex;gap:8px;margin-top:16px}.form-actions .btn{flex:1}.print-title{display:none}@media print{header,.toolbar,.tabs,.fab,dialog,.summary,.actions{display:none!important}body{background:#fff}main{max-width:none;padding:0}.item{box-shadow:none;border:0;border-bottom:1px solid #bbb;border-radius:0;margin:0;padding:8px}.print-title{display:block!important}}
</style></head><body><header><h1>🛒 Einkauf Zuhause am Bach</h1><div class="sub">Günstigste Angebote · Route HOFER → PENNY → BILLA → SPAR</div><div id="status" class="status">Angebote werden geladen …</div></header><main><div class="print-title"><h1>Einkaufsliste – Zuhause am Bach</h1><p id="printDate"></p></div><div class="toolbar"><button class="btn" id="refresh">↻ Preise aktualisieren</button><button class="btn gold" id="print">🖨 Drucken / PDF</button><button class="btn secondary" id="openOnly">Nur offene Artikel</button><button class="btn secondary" id="resetChecks">Haken zurücksetzen</button></div><div class="summary"><div class="metric"><strong id="count">0</strong><span>Artikel</span></div><div class="metric"><strong id="shops">0</strong><span>Geschäfte</span></div><div class="metric"><strong id="total">0 €</strong><span>bekannte Kosten</span></div></div><div class="tabs" id="tabs"></div><div id="list"></div></main><button class="fab" id="add">+</button><dialog id="dialog"><form method="dialog" id="form"><h3 id="dialogTitle">Eigenen Artikel hinzufügen</h3><input type="hidden" id="editId"><label>Artikel<input id="fItem" required></label><label>Kategorie<select id="fCategory"><option>Lebensmittel</option><option>Getränke</option><option>Wein</option><option>Büromaterial</option><option>Foto-Erkennung</option><option>Sonstiges</option></select></label><label>Geschäft<select id="fShop"><option>HOFER</option><option>PENNY</option><option>BILLA</option><option>SPAR</option></select></label><label>Marke / Produkt<input id="fBrand"></label><label>Menge<input id="fQty" value="1"></label><label>Preis €<input id="fPrice" inputmode="decimal"></label><div class="form-actions"><button class="btn secondary" value="cancel">Abbrechen</button><button class="btn" value="default">Speichern</button></div></form></dialog><script>
const URL='https://raw.githubusercontent.com/topdiveair-sketch/windi-chronik/main/einkauf-angebote/angebote.json',shopOrder=['HOFER','PENNY','BILLA','SPAR'];let offers=[],category='Alle',showOpenOnly=false;const state=JSON.parse(localStorage.getItem('shoppingState')||'{}'),custom=JSON.parse(localStorage.getItem('customItems')||'[]');function money(v){const n=Number(String(v||0).replace(',','.'));return n>0?n.toLocaleString('de-AT',{style:'currency',currency:'EUR'}):'Preis offen'}function normalize(o,i){return{id:o.id||'remote'+i,item:o.item||o.product||'Artikel',category:o.category||'Lebensmittel',shop:(o.shop||'SPAR').toUpperCase(),brand:o.brand||o.product||'',product:o.product||'',price:Number(String(o.price||0).replace(',','.'))||0,unitPrice:o.unitPrice||'',package:o.package||'',quantity:o.quantity||1,regularPrice:o.regularPrice||o.normalPrice||'',discount:o.discount||'',validUntil:o.validUntil||'',verified:o.verified!==false&&Number(o.price)>0,manual:false}}function saveCustom(){localStorage.setItem('customItems',JSON.stringify(custom))}function saveState(){localStorage.setItem('shoppingState',JSON.stringify(state))}function bestUnique(list){const m=new Map;for(const o of list){const k=o.manual?'manual:'+o.id:o.item.toLowerCase(),old=m.get(k);if(!old||compare(o,old)<0)m.set(k,o)}return[...m.values()]}function compare(a,b){if(a.verified!==b.verified)return a.verified?-1:1;const x=parseFloat(a.unitPrice)||a.price||999999,y=parseFloat(b.unitPrice)||b.price||999999;return x!==y?x-y:shopOrder.indexOf(a.shop)-shopOrder.indexOf(b.shop)}async function load(manual=false){status.textContent='Aktuelle Angebote werden geladen …';try{const r=await fetch(URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json(),remote=(d.offers||[]).map(normalize);offers=bestUnique([...remote,...custom.map(x=>({...x,manual:true}))]);localStorage.setItem('lastOffers',JSON.stringify(offers));localStorage.setItem('lastUpdated',d.updated||new Date().toISOString());status.textContent='Aktualisiert: '+(d.updated||new Date().toLocaleString('de-AT'));render()}catch(e){offers=JSON.parse(localStorage.getItem('lastOffers')||'[]');status.textContent='Offline – gespeicherte Preise';render();if(manual)alert('Aktualisierung nicht möglich.')}}function renderTabs(){const c=['Alle',...new Set(offers.map(x=>x.category))];tabs.innerHTML=c.map(x=>`<button class="tab ${x===category?'active':''}" data-c="${x}">${x}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{category=b.dataset.c;render()})}function render(){renderTabs();let a=offers.filter(o=>category==='Alle'||o.category===category);if(showOpenOnly)a=a.filter(o=>!state[o.id]);a.sort((x,y)=>shopOrder.indexOf(x.shop)-shopOrder.indexOf(y.shop)||x.item.localeCompare(y.item,'de'));const g={};a.forEach(o=>(g[o.shop]??=[]).push(o));let h='',sum=0,sc=0;for(const s of shopOrder){const rows=g[s]||[];if(!rows.length)continue;sc++;h+=`<section class="shop"><h2>${s}<small>${rows.length} Artikel</small></h2>`;for(const o of rows){if(o.price>0)sum+=o.price*(Number(o.quantity)||1);const done=!!state[o.id];h+=`<article class="item ${done?'done':''}"><div class="row"><input class="check" type="checkbox" data-id="${esc(o.id)}" ${done?'checked':''}><div class="grow"><div class="title">${esc(o.item)}</div><div class="brand">${esc(o.brand||o.product||'Noch kein verifiziertes Angebot')}</div><div class="meta">${o.verified?'<span class="chip">✓ verifiziert</span>':'<span class="chip bad">Preis nicht verifiziert</span>'}${o.discount?`<span class="chip action">${esc(o.discount)}</span>`:''}<span class="chip">${esc(o.category||'Sonstiges')}</span></div><div class="details">${detail(o)}</div>${o.manual?`<div class="actions"><button class="mini edit" data-id="${esc(o.id)}">✏️ Ändern</button><button class="mini delete" data-id="${esc(o.id)}">🗑 Löschen</button></div>`:''}</div><div class="price">${money(o.price)}</div></div></article>`}h+='</section>'}list.innerHTML=h||'<div class="empty">Keine Artikel vorhanden.</div>';document.querySelectorAll('.check').forEach(c=>c.onchange=()=>{state[c.dataset.id]=c.checked;saveState();render()});document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>editItem(b.dataset.id));document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>deleteItem(b.dataset.id));count.textContent=a.length;shops.textContent=sc;total.textContent=money(sum);printDate.textContent='Stand: '+(localStorage.getItem('lastUpdated')||new Date().toLocaleString('de-AT'))}function detail(o){const p=[];if(o.quantity)p.push('Menge: '+o.quantity);if(o.package)p.push('Gebinde: '+o.package);if(o.unitPrice)p.push('Grundpreis: '+o.unitPrice);if(o.validUntil)p.push('gültig bis '+o.validUntil);return p.join(' · ')||'Keine weiteren Angaben'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function openAdd(){editId.value='';dialogTitle.textContent='Eigenen Artikel hinzufügen';form.reset();fQty.value='1';dialog.showModal()}function editItem(id){const x=custom.find(v=>v.id===id);if(!x)return;editId.value=id;dialogTitle.textContent='Artikel ändern';fItem.value=x.item||'';fCategory.value=x.category||'Sonstiges';fShop.value=x.shop||'SPAR';fBrand.value=x.brand||'';fQty.value=x.quantity||1;fPrice.value=x.price||'';dialog.showModal()}function deleteItem(id){const x=custom.find(v=>v.id===id);if(!x||!confirm('„'+x.item+'“ wirklich löschen?'))return;custom.splice(custom.findIndex(v=>v.id===id),1);delete state[id];saveCustom();saveState();offers=offers.filter(v=>v.id!==id);render()}const status=document.querySelector('#status'),tabs=document.querySelector('#tabs'),list=document.querySelector('#list'),count=document.querySelector('#count'),shops=document.querySelector('#shops'),total=document.querySelector('#total'),printDate=document.querySelector('#printDate'),dialog=document.querySelector('#dialog'),form=document.querySelector('#form'),editId=document.querySelector('#editId'),dialogTitle=document.querySelector('#dialogTitle');refresh.onclick=()=>load(true);print.onclick=()=>window.Android?Android.printShoppingList():window.print();openOnly.onclick=()=>{showOpenOnly=!showOpenOnly;openOnly.textContent=showOpenOnly?'Alle Artikel anzeigen':'Nur offene Artikel';render()};resetChecks.onclick=()=>{Object.keys(state).forEach(k=>delete state[k]);saveState();render()};add.onclick=openAdd;form.onsubmit=e=>{if(e.submitter&&e.submitter.value==='cancel')return;const id=editId.value,x={id:id||'custom'+Date.now(),item:fItem.value.trim(),category:fCategory.value,shop:fShop.value,brand:fBrand.value.trim(),quantity:fQty.value||1,price:Number(String(fPrice.value).replace(',','.'))||0,verified:false,manual:true};if(id){const i=custom.findIndex(v=>v.id===id);if(i>=0)custom[i]=x}else custom.push(x);saveCustom();form.reset();load(false)};load();
</script></body></html>
