<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#214d3a">
<title>Einkauf Zuhause am Bach</title>
<style>
:root{--green:#214d3a;--green2:#2f6b50;--cream:#f5f1e8;--card:#fff;--text:#17231d;--muted:#67746d;--line:#dbe3de;--accent:#f3c763;--danger:#a43b3b}
*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text)}
header{background:linear-gradient(135deg,var(--green),var(--green2));color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:10;box-shadow:0 3px 12px #0003}
header h1{font-size:24px;margin:0 0 4px}.sub{font-size:13px;opacity:.9}.status{margin-top:10px;font-size:12px;padding:8px 10px;border-radius:10px;background:#ffffff18}
main{max-width:760px;margin:auto;padding:14px 14px 110px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.btn{border:0;border-radius:13px;padding:13px 12px;font-weight:750;font-size:14px;background:var(--green);color:#fff;box-shadow:0 2px 6px #0002}.btn.secondary{background:#fff;color:var(--green);border:1px solid var(--line)}.btn.gold{background:#b7791f}.btn.danger{background:var(--danger)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.metric{background:#fff;border-radius:14px;padding:12px;text-align:center;border:1px solid var(--line)}.metric strong{display:block;font-size:20px}.metric span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 10px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:650}.tab.active{background:var(--green);color:#fff}
.shop{margin:12px 0 18px}.shop h2{margin:0 0 8px;font-size:18px;display:flex;justify-content:space-between;align-items:center}.shop h2 small{font-size:12px;color:var(--muted);font-weight:600}.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin:8px 0;box-shadow:0 2px 8px #0000000b}.row{display:flex;gap:10px;align-items:flex-start}.check{width:24px;height:24px;margin-top:2px;accent-color:var(--green)}.grow{flex:1}.title{font-weight:800;font-size:16px}.brand{font-size:13px;color:var(--muted);margin-top:2px}.price{font-size:19px;font-weight:850;color:var(--green);white-space:nowrap}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.chip{font-size:11px;background:#eef4f0;padding:5px 7px;border-radius:999px;color:#385345}.chip.action{background:#fff0bd;color:#6d4c00}.chip.bad{background:#fbe4e4;color:#7f2525}.details{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.45}.done{opacity:.5}.done .title{text-decoration:line-through}
.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}
.fab{position:fixed;right:18px;bottom:20px;width:58px;height:58px;border-radius:50%;font-size:30px;border:0;background:var(--green);color:#fff;box-shadow:0 5px 18px #0005}
dialog{border:0;border-radius:18px;width:min(92vw,520px);padding:0;box-shadow:0 15px 50px #0005}dialog form{padding:18px}dialog h3{margin-top:0}label{display:block;font-size:12px;font-weight:700;margin-top:10px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin-top:4px}.form-actions{display:flex;gap:8px;margin-top:16px}.form-actions .btn{flex:1}
@media print{header,.toolbar,.tabs,.fab,dialog,.summary{display:none!important}body{background:#fff}main{max-width:none;padding:0}.shop{break-inside:avoid}.item{box-shadow:none;border:0;border-bottom:1px solid #bbb;border-radius:0;margin:0;padding:8px}.check{appearance:none;border:1px solid #333;width:16px;height:16px}.details{font-size:10px}.price{font-size:14px}.shop h2{margin-top:18px}.print-title{display:block!important}}
.print-title{display:none}
</style>
</head>
<body>
<header><h1>🛒 Einkauf Zuhause am Bach</h1><div class="sub">Günstigste Angebote · Route HOFER → PENNY → BILLA → SPAR</div><div id="status" class="status">Angebote werden geladen …</div></header>
<main>
<div class="print-title"><h1>Einkaufsliste – Zuhause am Bach</h1><p id="printDate"></p></div>
<div class="toolbar"><button class="btn" id="refresh">↻ Preise aktualisieren</button><button class="btn gold" id="print">🖨 Drucken / PDF</button><button class="btn secondary" id="openOnly">Nur offene Artikel</button><button class="btn secondary" id="resetChecks">Haken zurücksetzen</button></div>
<div class="summary"><div class="metric"><strong id="count">0</strong><span>Artikel</span></div><div class="metric"><strong id="shops">0</strong><span>Geschäfte</span></div><div class="metric"><strong id="total">0 €</strong><span>bekannte Kosten</span></div></div>
<div class="tabs" id="tabs"></div><div id="list"></div>
</main>
<button class="fab" id="add">+</button>
<dialog id="dialog"><form method="dialog" id="form"><h3>Eigenen Artikel hinzufügen</h3><label>Artikel<input id="fItem" required placeholder="z. B. Küchenrolle"></label><label>Kategorie<select id="fCategory"><option>Lebensmittel</option><option>Getränke</option><option>Wein</option><option>Büromaterial</option><option>Sonstiges</option></select></label><label>Geschäft<select id="fShop"><option>HOFER</option><option>PENNY</option><option>BILLA</option><option>SPAR</option></select></label><label>Marke / Produkt<input id="fBrand" placeholder="optional"></label><label>Menge<input id="fQty" value="1"></label><label>Preis €<input id="fPrice" inputmode="decimal" placeholder="0,00"></label><div class="form-actions"><button class="btn secondary" value="cancel">Abbrechen</button><button class="btn" value="default" id="save">Speichern</button></div></form></dialog>
<script>
const URL='https://raw.githubusercontent.com/topdiveair-sketch/windi-chronik/main/einkauf-angebote/angebote.json';
const shopOrder=['HOFER','PENNY','BILLA','SPAR'];
const fallback=[
['Semmeln/Brötchen','Lebensmittel','HOFER'],['Brot','Lebensmittel','HOFER'],['Butter','Lebensmittel','HOFER'],['Marmelade','Lebensmittel','SPAR'],['Honig','Lebensmittel','HOFER'],['Schinken','Lebensmittel','PENNY'],['Aufschnitt','Lebensmittel','PENNY'],['Käse','Lebensmittel','PENNY'],['Eier','Lebensmittel','HOFER'],['Joghurt','Lebensmittel','PENNY'],['Milch','Lebensmittel','PENNY'],['Orangensaft','Getränke','PENNY'],['Kaffee','Lebensmittel','PENNY'],['Tee','Lebensmittel','HOFER'],['Obst','Lebensmittel','HOFER'],['Gemüse','Lebensmittel','PENNY'],['Mineralwasser','Getränke','BILLA'],['Weizenbier','Getränke','SPAR'],['Weißwein Niederösterreich/Wachau','Wein','SPAR'],['Roséwein Niederösterreich/Wachau','Wein','SPAR'],['Rotwein Niederösterreich/Wachau','Wein','SPAR'],['Canon PG-510 Schwarz','Büromaterial','SPAR'],['Canon CL-511 Farbe','Büromaterial','SPAR'],['Kopierpapier DIN A4','Büromaterial','SPAR']
].map((x,i)=>({id:'base'+i,item:x[0],category:x[1],shop:x[2],brand:'',price:0,verified:false,quantity:1}));
let offers=[], category='Alle', openOnly=false;
const state=JSON.parse(localStorage.getItem('shoppingState')||'{}');
const custom=JSON.parse(localStorage.getItem('customItems')||'[]');
function money(v){const n=Number(String(v||0).replace(',','.'));return n>0?n.toLocaleString('de-AT',{style:'currency',currency:'EUR'}):'Preis offen'}
function normalize(o,i){return {id:o.id||('remote'+i),item:o.item||o.product||'Artikel',category:o.category||guessCategory(o.item),shop:(o.shop||'SPAR').toUpperCase(),brand:o.brand||o.product||'',product:o.product||'',price:Number(String(o.price||0).replace(',','.'))||0,unitPrice:o.unitPrice||'',package:o.package||'',quantity:o.quantity||1,regularPrice:o.regularPrice||o.normalPrice||'',discount:o.discount||'',validUntil:o.validUntil||'',origin:o.origin||'',region:o.region||'',variety:o.variety||'',verified:o.verified!==false&&Number(o.price)>0,source:o.source||'',manual:false}}
function guessCategory(s=''){s=s.toLowerCase();if(s.includes('wein'))return'Wein';if(s.includes('canon')||s.includes('papier'))return'Büromaterial';if(s.includes('bier')||s.includes('wasser')||s.includes('saft'))return'Getränke';return'Lebensmittel'}
function saveState(){localStorage.setItem('shoppingState',JSON.stringify(state))}
function bestUnique(list){const map=new Map();for(const o of list){const key=o.item.toLowerCase();const old=map.get(key);if(!old||compare(o,old)<0)map.set(key,o)}return [...map.values()]}
function compare(a,b){if(a.verified!==b.verified)return a.verified?-1:1;const au=parseFloat(a.unitPrice)||a.price||999999,bu=parseFloat(b.unitPrice)||b.price||999999;if(au!==bu)return au-bu;return shopOrder.indexOf(a.shop)-shopOrder.indexOf(b.shop)}
async function load(manual=false){document.querySelector('#status').textContent='Aktuelle Angebote werden geladen …';try{const r=await fetch(URL+'?t='+Date.now());if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const remote=(data.offers||[]).map(normalize);offers=bestUnique([...remote,...custom.map((x,i)=>({...x,id:x.id||'c'+i,manual:true}))]);localStorage.setItem('lastOffers',JSON.stringify(offers));localStorage.setItem('lastUpdated',data.updated||new Date().toISOString());document.querySelector('#status').textContent='Aktualisiert: '+(data.updated||new Date().toLocaleString('de-AT'));render()}catch(e){offers=JSON.parse(localStorage.getItem('lastOffers')||'null')||bestUnique([...fallback,...custom]);document.querySelector('#status').textContent='Offline – zuletzt gespeicherte Preise werden angezeigt';render();if(manual)alert('Aktualisierung nicht möglich. Gespeicherte Liste bleibt erhalten.')}}
function renderTabs(){const cats=['Alle',...new Set(offers.map(x=>x.category))];tabs.innerHTML=cats.map(c=>`<button class="tab ${c===category?'active':''}" data-c="${c}">${c}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{category=b.dataset.c;render()})}
function render(){renderTabs();let list=offers.filter(o=>category==='Alle'||o.category===category);if(openOnly)list=list.filter(o=>!state[o.id]);list.sort((a,b)=>shopOrder.indexOf(a.shop)-shopOrder.indexOf(b.shop)||a.item.localeCompare(b.item,'de'));
const grouped={};list.forEach(o=>(grouped[o.shop]??=[]).push(o));let html='';let total=0,activeShops=0;for(const shop of shopOrder){const rows=grouped[shop]||[];if(!rows.length)continue;activeShops++;html+=`<section class="shop"><h2>${shop}<small>${rows.length} Artikel</small></h2>`;for(const o of rows){if(o.price>0)total+=o.price*(Number(o.quantity)||1);const done=!!state[o.id];html+=`<article class="item ${done?'done':''}"><div class="row"><input class="check" type="checkbox" data-id="${o.id}" ${done?'checked':''}><div class="grow"><div class="title">${escapeHtml(o.item)}</div><div class="brand">${escapeHtml(o.brand||o.product||'Noch kein verifiziertes Angebot')}</div><div class="meta">${o.verified?'<span class="chip">✓ verifiziert</span>':'<span class="chip bad">Preis nicht verifiziert</span>'}${o.discount?`<span class="chip action">${escapeHtml(o.discount)}</span>`:''}${o.category?`<span class="chip">${escapeHtml(o.category)}</span>`:''}</div><div class="details">${detail(o)}</div></div><div class="price">${money(o.price)}</div></div></article>`}html+='</section>'}
listEl.innerHTML=html||'<div class="empty">Für diesen Filter sind keine Artikel vorhanden.</div>';document.querySelectorAll('.check').forEach(c=>c.onchange=()=>{state[c.dataset.id]=c.checked;saveState();render()});count.textContent=list.length;shops.textContent=activeShops;document.querySelector('#total').textContent=money(total);document.querySelector('#printDate').textContent='Stand: '+(localStorage.getItem('lastUpdated')||new Date().toLocaleString('de-AT'))}
function detail(o){const p=[];if(o.quantity)p.push('Menge: '+o.quantity);if(o.package)p.push('Gebinde: '+o.package);if(o.unitPrice)p.push('Grundpreis: '+o.unitPrice);if(o.regularPrice)p.push('Normalpreis: '+o.regularPrice);if(o.origin||o.region)p.push('Herkunft: '+[o.origin,o.region].filter(Boolean).join(' · '));if(o.variety)p.push('Sorte: '+o.variety);if(o.validUntil)p.push('gültig bis '+o.validUntil);return p.join(' · ')||'Keine weiteren Angaben'}
function escapeHtml(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
const tabs=document.querySelector('#tabs'),listEl=document.querySelector('#list'),count=document.querySelector('#count'),shops=document.querySelector('#shops');
refresh.onclick=()=>load(true);print.onclick=()=>{if(window.Android)Android.printShoppingList();else window.print()};openOnly.onclick=()=>{openOnly=!openOnly;openOnlyBtn()};function openOnlyBtn(){document.querySelector('#openOnly').textContent=openOnly?'Alle Artikel anzeigen':'Nur offene Artikel';render()};resetChecks.onclick=()=>{Object.keys(state).forEach(k=>delete state[k]);saveState();render()};add.onclick=()=>dialog.showModal();form.onsubmit=e=>{if(e.submitter&&e.submitter.value==='cancel')return;const x={id:'custom'+Date.now(),item:fItem.value.trim(),category:fCategory.value,shop:fShop.value,brand:fBrand.value.trim(),quantity:fQty.value||1,price:Number(String(fPrice.value).replace(',','.'))||0,verified:false,manual:true};custom.push(x);localStorage.setItem('customItems',JSON.stringify(custom));offers.push(x);form.reset();render()};load();
</script>
</body></html>
